<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Architecture of the Hello Gallery reference specimen</title>
  <desc id="desc">A synthetic input exercises Showroom, Distribution, and Control planes, then stops at a hard boundary before real projects and catalog state.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06101b"/>
      <stop offset="1" stop-color="#0c1728"/>
    </linearGradient>
    <marker id="arrowCyan" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#67e8e1"/>
    </marker>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#88a9ff"/>
    </marker>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.025"/>
    </pattern>
  </defs>
  <rect width="1440" height="900" rx="28" fill="url(#bg)"/>
  <rect width="1440" height="900" rx="28" fill="url(#grid)"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="86" y="82" fill="#67e8e1" font-family="Consolas,monospace" font-size="14" font-weight="700" letter-spacing="2.6">G2.0 · REFERENCE ARCHITECTURE</text>
    <text x="86" y="146" fill="#f2f6fd" font-size="46" font-weight="700" letter-spacing="-2">Exercise the room. Preserve the boundary.</text>
    <text x="86" y="184" fill="#96a6bc" font-size="16">The specimen tests presentation mechanics without entering the project lifecycle.</text>

    <g transform="translate(86 262)">
      <rect width="248" height="338" rx="20" fill="#0c1a2a" stroke="#ba9cff" stroke-opacity="0.3"/>
      <text x="24" y="40" fill="#ba9cff" font-family="Consolas,monospace" font-size="11" font-weight="700" letter-spacing="1.7">SYNTHETIC INPUT</text>
      <text x="24" y="88" fill="#f2f6fd" font-size="24" font-weight="700">Hello Gallery</text>
      <text x="24" y="116" fill="#8fa0b7" font-size="13">Minimal fixture content</text>
      <g transform="translate(24 157)" font-family="Consolas,monospace" font-size="11">
        <rect width="200" height="38" rx="8" fill="#121f32"/>
        <text x="14" y="24" fill="#d9e3f0">REFERENCE_SPECIMEN</text>
        <rect y="48" width="200" height="38" rx="8" fill="#121f32"/>
        <text x="14" y="72" fill="#d9e3f0">0.0.0-reference</text>
        <rect y="96" width="200" height="38" rx="8" fill="#121f32"/>
        <text x="14" y="120" fill="#d9e3f0">No upstream lab</text>
      </g>
      <text x="24" y="312" fill="#66748b" font-size="11">Disposable content</text>
    </g>

    <path d="M349 431H410" stroke="#67e8e1" stroke-width="2" marker-end="url(#arrowCyan)"/>

    <g transform="translate(430 244)">
      <rect width="544" height="380" rx="22" fill="#0c1829" stroke="#67e8e1" stroke-opacity="0.25"/>
      <text x="26" y="40" fill="#67e8e1" font-family="Consolas,monospace" font-size="11" font-weight="700" letter-spacing="1.8">REFERENCE NAMESPACE</text>
      <text x="26" y="80" fill="#f2f6fd" font-size="26" font-weight="700">Gallery room under test</text>
      <g transform="translate(24 116)">
        <rect width="155" height="190" rx="15" fill="#102238" stroke="#67e8e1" stroke-opacity="0.28"/>
        <circle cx="24" cy="27" r="5" fill="#67e8e1"/>
        <text x="40" y="32" fill="#67e8e1" font-size="12" font-weight="700">SHOWROOM</text>
        <text x="17" y="70" fill="#f2f6fd" font-size="16" font-weight="700">Understand</text>
        <text x="17" y="98" fill="#8fa0b7" font-size="11">Overview</text>
        <text x="17" y="120" fill="#8fa0b7" font-size="11">Preview</text>
        <text x="17" y="142" fill="#8fa0b7" font-size="11">Architecture</text>
        <text x="17" y="164" fill="#8fa0b7" font-size="11">Language route</text>
      </g>
      <g transform="translate(194 116)">
        <rect width="155" height="190" rx="15" fill="#102238" stroke="#88a9ff" stroke-opacity="0.28"/>
        <circle cx="24" cy="27" r="5" fill="#88a9ff"/>
        <text x="40" y="32" fill="#88a9ff" font-size="12" font-weight="700">DISTRIBUTION</text>
        <text x="17" y="70" fill="#f2f6fd" font-size="16" font-weight="700">Obtain</text>
        <text x="17" y="98" fill="#8fa0b7" font-size="11">Quick Start</text>
        <text x="17" y="120" fill="#8fa0b7" font-size="11">Scope</text>
        <text x="17" y="142" fill="#8fa0b7" font-size="11">Artifacts</text>
        <text x="17" y="164" fill="#8fa0b7" font-size="11">Limitations</text>
      </g>
      <g transform="translate(364 116)">
        <rect width="155" height="190" rx="15" fill="#102238" stroke="#f5b96a" stroke-opacity="0.28"/>
        <circle cx="24" cy="27" r="5" fill="#f5b96a"/>
        <text x="40" y="32" fill="#f5b96a" font-size="12" font-weight="700">CONTROL</text>
        <text x="17" y="70" fill="#f2f6fd" font-size="16" font-weight="700">Trust</text>
        <text x="17" y="98" fill="#8fa0b7" font-size="11">Status</text>
        <text x="17" y="120" fill="#8fa0b7" font-size="11">Origin</text>
        <text x="17" y="142" fill="#8fa0b7" font-size="11">Verifier</text>
        <text x="17" y="164" fill="#8fa0b7" font-size="11">Stop line</text>
      </g>
      <text x="26" y="348" fill="#66748b" font-family="Consolas,monospace" font-size="11">reference/hello-gallery/**</text>
      <text x="516" y="348" fill="#67e8e1" font-size="11" text-anchor="end">EXERCISED</text>
    </g>

    <path d="M992 431H1058" stroke="#88a9ff" stroke-width="2" stroke-dasharray="7 7" marker-end="url(#arrowBlue)"/>

    <g transform="translate(1080 262)">
      <rect width="274" height="338" rx="20" fill="#0a1320" stroke="#f5b96a" stroke-opacity="0.28" stroke-dasharray="8 8"/>
      <text x="24" y="40" fill="#f5b96a" font-family="Consolas,monospace" font-size="11" font-weight="700" letter-spacing="1.7">HARD BOUNDARY</text>
      <text x="24" y="84" fill="#f2f6fd" font-size="23" font-weight="700">Real lifecycle</text>
      <g transform="translate(24 119)" font-family="Consolas,monospace" font-size="11">
        <rect width="226" height="42" rx="8" fill="#151b25" stroke="#f5b96a" stroke-opacity="0.15"/>
        <text x="15" y="26" fill="#758298" text-decoration="line-through">projects/&lt;slug&gt;</text>
        <rect y="52" width="226" height="42" rx="8" fill="#151b25" stroke="#f5b96a" stroke-opacity="0.15"/>
        <text x="15" y="78" fill="#758298" text-decoration="line-through">product Release</text>
        <rect y="104" width="226" height="42" rx="8" fill="#151b25" stroke="#f5b96a" stroke-opacity="0.15"/>
        <text x="15" y="130" fill="#758298" text-decoration="line-through">catalog/exhibits</text>
        <rect y="156" width="226" height="42" rx="8" fill="#151b25" stroke="#f5b96a" stroke-opacity="0.15"/>
        <text x="15" y="175" fill="#758298" font-size="13" text-decoration="line-through">EN_PROFILE_ROUTABLE</text>
        <text x="15" y="193" fill="#758298" font-size="13" text-decoration="line-through">ZH_PROFILE_ROUTABLE</text>
      </g>
      <text x="24" y="313" fill="#f5b96a" font-size="11" font-weight="700">NO TRANSITION</text>
    </g>

    <g transform="translate(86 690)">
      <rect width="1268" height="120" rx="17" fill="#0b1625" stroke="#95afd5" stroke-opacity="0.15"/>
      <text x="28" y="38" fill="#66748b" font-family="Consolas,monospace" font-size="11">REFERENCE VERIFIER</text>
      <text x="28" y="74" fill="#f2f6fd" font-size="17" font-weight="700">Required files + accessible SVG + script-free demo + explicit ZH provenance + forbidden identities</text>
      <text x="28" y="99" fill="#8fa0b7" font-size="12">Expected readback: 0 projections · 0 candidates · 0 cataloged exhibits</text>
      <circle cx="1220" cy="59" r="18" fill="#67e8e1" fill-opacity="0.12" stroke="#67e8e1" stroke-opacity="0.4"/>
      <path d="M1212 59L1218 65L1229 52" fill="none" stroke="#67e8e1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="86" y="858" fill="#66748b" font-family="Consolas,monospace" font-size="12">A SPECIMEN EXERCISES THE GALLERY. AN EXHIBIT REPRESENTS A PROJECT.</text>
  </g>
</svg>
