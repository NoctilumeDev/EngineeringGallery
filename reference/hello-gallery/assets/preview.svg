<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Hello Gallery reference showroom preview</title>
  <desc id="desc">A dark engineering showroom with a large Hello Engineering Gallery heading, one coordinate card, and three responsibility cards.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060b13"/>
      <stop offset="0.58" stop-color="#0a1220"/>
      <stop offset="1" stop-color="#07101a"/>
    </linearGradient>
    <linearGradient id="headline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset="0.48" stop-color="#88a9ff"/>
      <stop offset="1" stop-color="#67e8e1"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14243a" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#0b1422" stop-opacity="0.94"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#315da6" stop-opacity="0.44"/>
      <stop offset="1" stop-color="#315da6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity="0.025"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1440" height="900" rx="24" fill="url(#background)"/>
  <circle cx="1290" cy="10" r="420" fill="url(#glow)"/>
  <rect width="1440" height="900" rx="24" fill="url(#grid)"/>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <g transform="translate(90 56)">
      <rect width="38" height="38" rx="10" fill="#67e8e1" fill-opacity="0.08" stroke="#67e8e1" stroke-opacity="0.36"/>
      <rect x="8" y="20" width="6" height="10" rx="2" fill="#67e8e1"/>
      <rect x="17" y="14" width="6" height="16" rx="2" fill="#88a9ff"/>
      <rect x="26" y="8" width="6" height="22" rx="2" fill="#f5b96a"/>
      <text x="53" y="16" fill="#f4f7ff" font-size="15" font-weight="700">Engineering Gallery</text>
      <text x="53" y="34" fill="#8291a8" font-size="10" letter-spacing="1.5">REFERENCE ROOM</text>
    </g>
    <g transform="translate(1138 61)">
      <rect width="212" height="30" rx="15" fill="#08101c" fill-opacity="0.75" stroke="#95afd5" stroke-opacity="0.18"/>
      <circle cx="17" cy="15" r="4" fill="#f5b96a"/>
      <text x="29" y="19" fill="#a9b7ca" font-family="Consolas,monospace" font-size="10" letter-spacing="0.8">REFERENCE_SPECIMEN</text>
    </g>
    <path d="M90 115H1350" stroke="#95afd5" stroke-opacity="0.16"/>

    <g transform="translate(90 192)">
      <text y="0" fill="#67e8e1" font-family="Consolas,monospace" font-size="12" font-weight="700" letter-spacing="2.2">G2.0 · SYNTHETIC ROOM TEST</text>
      <text y="104" fill="#f4f7ff" font-size="86" font-weight="650" letter-spacing="-5">Hello,</text>
      <text y="194" fill="url(#headline)" font-size="86" font-weight="650" letter-spacing="-5">Engineering Gallery.</text>
      <text y="244" fill="#9ba9be" font-size="18">A finished room for testing how a real exhibit will be understood,</text>
      <text y="272" fill="#9ba9be" font-size="18">obtained, and trusted—without pretending that a project has shipped.</text>
      <g transform="translate(0 310)">
        <rect width="154" height="46" rx="10" fill="#67e8e1"/>
        <text x="77" y="29" fill="#061019" font-size="13" font-weight="700" text-anchor="middle">Explore the room</text>
        <rect x="166" width="184" height="46" rx="10" fill="#0c1524" stroke="#8fb5e4" stroke-opacity="0.3"/>
        <text x="258" y="29" fill="#d8e2f2" font-size="13" font-weight="700" text-anchor="middle">Read specimen record ↗</text>
      </g>
    </g>

    <g transform="translate(1006 190)" filter="url(#shadow)">
      <rect width="344" height="326" rx="18" fill="url(#panel)" stroke="#8fb5e4" stroke-opacity="0.3"/>
      <text x="24" y="34" fill="#9ba9be" font-family="Consolas,monospace" font-size="10" letter-spacing="1.6">ROOM COORDINATE</text>
      <circle cx="316" cy="29" r="4" fill="#67e8e1"/>
      <path d="M24 54H320" stroke="#95afd5" stroke-opacity="0.16"/>
      <g font-family="Consolas,monospace" font-size="11">
        <text x="24" y="86" fill="#66748b">Kind</text><text x="108" y="86" fill="#dbe7f8">REFERENCE_SPECIMEN</text>
        <text x="24" y="126" fill="#66748b">Marker</text><text x="108" y="126" fill="#dbe7f8">0.0.0-reference</text>
        <text x="24" y="166" fill="#66748b">Projects</text><text x="108" y="166" fill="#dbe7f8">0</text>
        <text x="24" y="206" fill="#66748b">Cataloged</text><text x="108" y="206" fill="#dbe7f8">0</text>
      </g>
      <path d="M24 226H320" stroke="#95afd5" stroke-opacity="0.16"/>
      <text x="24" y="266" fill="#f5b96a" font-size="10" font-weight="700" letter-spacing="1.5">PERMANENT BOUNDARY</text>
      <text x="24" y="292" fill="#f4f7ff" font-size="15" font-weight="700">Never promoted</text>
    </g>

    <path d="M90 570H1350" stroke="#95afd5" stroke-opacity="0.16"/>
    <text x="90" y="608" fill="#67e8e1" font-family="Consolas,monospace" font-size="11">01</text>
    <text x="127" y="608" fill="#d4dfef" font-size="14">A specimen exercises the Gallery.</text>
    <path d="M365 603H415" stroke="#8fb5e4" stroke-opacity="0.35"/>
    <text x="435" y="608" fill="#d4dfef" font-size="14">An exhibit represents a project.</text>
    <path d="M90 634H1350" stroke="#95afd5" stroke-opacity="0.16"/>

    <g transform="translate(90 684)">
      <g>
        <rect width="405" height="146" rx="16" fill="#0d1727" fill-opacity="0.84" stroke="#95afd5" stroke-opacity="0.16"/>
        <text x="24" y="30" fill="#66748b" font-family="Consolas,monospace" font-size="10">01</text>
        <text x="24" y="76" fill="#f4f7ff" font-size="24" font-weight="700">Showroom</text>
        <text x="24" y="104" fill="#9ba9be" font-size="13">Understand the released result.</text>
        <path d="M24 121H381" stroke="#67e8e1" stroke-opacity="0.18"/>
        <circle cx="367" cy="30" r="18" fill="#67e8e1" fill-opacity="0.1" stroke="#67e8e1" stroke-opacity="0.32"/>
      </g>
      <g transform="translate(427)">
        <rect width="405" height="146" rx="16" fill="#0d1727" fill-opacity="0.84" stroke="#95afd5" stroke-opacity="0.16"/>
        <text x="24" y="30" fill="#66748b" font-family="Consolas,monospace" font-size="10">02</text>
        <text x="24" y="76" fill="#f4f7ff" font-size="24" font-weight="700">Distribution</text>
        <text x="24" y="104" fill="#9ba9be" font-size="13">Obtain and run the bounded result.</text>
        <path d="M24 121H381" stroke="#88a9ff" stroke-opacity="0.18"/>
        <circle cx="367" cy="30" r="18" fill="#88a9ff" fill-opacity="0.1" stroke="#88a9ff" stroke-opacity="0.32"/>
      </g>
      <g transform="translate(854)">
        <rect width="406" height="146" rx="16" fill="#0d1727" fill-opacity="0.84" stroke="#95afd5" stroke-opacity="0.16"/>
        <text x="24" y="30" fill="#66748b" font-family="Consolas,monospace" font-size="10">03</text>
        <text x="24" y="76" fill="#f4f7ff" font-size="24" font-weight="700">Control</text>
        <text x="24" y="104" fill="#9ba9be" font-size="13">Keep provenance and state explicit.</text>
        <path d="M24 121H382" stroke="#f5b96a" stroke-opacity="0.18"/>
        <circle cx="368" cy="30" r="18" fill="#f5b96a" fill-opacity="0.1" stroke="#f5b96a" stroke-opacity="0.32"/>
      </g>
    </g>
  </g>
</svg>
